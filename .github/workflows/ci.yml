name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: dotnet test MarketPulse.sln --nologo --configuration Release
      - name: Web build
        working-directory: web
        run: npm ci && npm run build

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/docker/Api.Dockerfile -t marketpulse-api:ci .
      - name: Build workers image
        run: docker build -f deploy/docker/Workers.Dockerfile -t marketpulse-workers:ci .
      - name: Build web image
        run: docker build -f deploy/docker/Web.Dockerfile -t marketpulse-web:ci .

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: NuGet vulnerable packages
        run: dotnet restore MarketPulse.sln && dotnet list MarketPulse.sln package --vulnerable --include-transitive
        continue-on-error: true
      - name: npm audit
        working-directory: web
        run: npm ci && npm audit --omit=dev
        continue-on-error: true
