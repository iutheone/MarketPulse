services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=warn
    ports:
      - "9092:19092"
      - "9644:9644"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
      POSTGRES_DB: marketpulse
    volumes:
      - marketpulse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: marketpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092

  prometheus:
    image: prom/prometheus:v2.54.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Api.Dockerfile
    ports:
      - "5082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kafka__BootstrapServers: redpanda:9092
      Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=2000
      Postgres__ConnectionString: Host=postgres;Port=5432;Database=marketpulse;Username=marketpulse;Password=marketpulse
      SignalR__AllowedOrigins__0: http://localhost:8088
      SignalR__AllowedOrigins__1: http://localhost:5173
      SignalR__AllowedOrigins__2: http://localhost:5174
      SignalR__UseRedisBackplane: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started

  workers:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Workers.Dockerfile
    ports:
      - "9465:9465"
    environment:
      MarketData__Provider: Synthetic
      MarketData__Mode: Streaming
      Kafka__BootstrapServers: redpanda:9092
      Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=2000
      Postgres__ConnectionString: Host=postgres;Port=5432;Database=marketpulse;Username=marketpulse;Password=marketpulse
      Observability__WorkerMetricsUrl: http://+:9465/
      TwelveData__ApiKey: ${TWELVE_DATA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Web.Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  marketpulse-pg:
