apiVersion: v1
kind: Namespace
metadata:
  name: marketpulse
  labels:
    app.kubernetes.io/name: marketpulse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketpulse
  namespace: marketpulse
data:
  Kafka__BootstrapServers: "redpanda:9092"
  Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=2000"
  Postgres__ConnectionString: "Host=postgres;Port=5432;Database=marketpulse;Username=marketpulse;Password=marketpulse"
  MarketData__Provider: "Synthetic"
  MarketData__Mode: "Streaming"
  SignalR__AllowedOrigins__0: "http://localhost:30080"
  Observability__WorkerMetricsUrl: "http://+:9465/"
---
apiVersion: v1
kind: Secret
metadata:
  name: marketpulse
  namespace: marketpulse
type: Opaque
stringData:
  TwelveData__ApiKey: ""
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: marketpulse
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092
            - --advertise-kafka-addr
            - internal://redpanda:9092
            - --mode
            - dev-container
            - --smp
            - "1"
            - --default-log-level=warn
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: marketpulse
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: marketpulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: marketpulse
            - name: POSTGRES_PASSWORD
              value: marketpulse
            - name: POSTGRES_DB
              value: marketpulse
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "marketpulse", "-d", "marketpulse"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: marketpulse
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: marketpulse-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: marketpulse
            - secretRef:
                name: marketpulse
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Kafka__ClientId
              value: marketpulse-api
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workers
  namespace: marketpulse
spec:
  selector:
    app: workers
  ports:
    - name: metrics
      port: 9465
      targetPort: 9465
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      containers:
        - name: workers
          image: marketpulse-workers:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9465
          envFrom:
            - configMapRef:
                name: marketpulse
            - secretRef:
                name: marketpulse
          livenessProbe:
            tcpSocket:
              port: 9465
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: marketpulse
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: marketpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: marketpulse-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
